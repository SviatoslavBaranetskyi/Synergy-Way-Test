services:
  db:
    image: postgres:16-alpine
    container_name: synergy-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: synergy-web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./:/app

  redis:
    image: redis:7-alpine
    container_name: synergy-redis
    ports:
      - "6379:6379"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: synergy-celery-worker
    command: celery -A app.core.celery_app worker -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./:/app

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: synergy-celery-beat
    command: celery -A app.core.celery_app beat -l info
    env_file:
      - .env
    depends_on:
      - worker
    volumes:
      - ./:/app

volumes:
  pgdata:
