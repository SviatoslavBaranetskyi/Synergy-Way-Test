[project]
name = "synergy-way-task"
version = "0.1.0"
description = "Celery-based periodic data ingestion service"
requires-python = ">=3.10.12"

dependencies = [
  "celery>=5.3",
  "redis>=5.0",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic-settings>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-mock>=3.12",
  "black>=24.0",
  "ruff>=0.3",
]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
(
  ^\.venv/
| ^venv/
| ^migrations/
| ^alembic/
)
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".venv",
  "venv",
  "migrations",
  "alembic",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
combine-as-imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]